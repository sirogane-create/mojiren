<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>もじれん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ひらがな・カタカナ・漢字を書き順チェックつきで練習できるアプリ">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もじれん">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7;
    --surface: #fffdf8;
    --paper: #fffef9;
    --ink: #2b2620;
    --muted: #8a7f70;
    --line: #e4dccd;
    --grid: #e7a7a0;
    --guide: #b9b0a2;
    --accent: #c8442f;
    --accent-soft: #f6e1db;
    --good: #3f8f5a;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 6px 24px rgba(60,40,20,.08);
    --pen: #1d1a17;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1916; --surface: #24211d; --paper: #2b2823; --ink: #eee7da; --muted: #a39887;
      --line: #3a352e; --grid: #8a4a43; --guide: #5e574d; --accent: #ec7a63; --accent-soft: #3d2924;
      --good: #6cc48a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35); --pen: #f4efe6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1916; --surface: #24211d; --paper: #2b2823; --ink: #eee7da; --muted: #a39887;
    --line: #3a352e; --grid: #8a4a43; --guide: #5e574d; --accent: #ec7a63; --accent-soft: #3d2924;
    --good: #6cc48a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35); --pen: #f4efe6;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    min-height: 100vh; -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button { font: inherit; color: inherit; }
  header {
    display: flex; align-items: center; gap: 12px; padding-block: 14px;
    max-width: 1100px; margin: 0 auto;
  }
  .logo { font-family: "Klee One", serif; font-weight: 600; font-size: 26px; letter-spacing: .04em; }
  .logo span { color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 6px 14px; cursor: pointer; font-size: 14px;
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  main {
    max-width: 1100px; margin: 0 auto; padding-block: 0 32px;
    display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .board-wrap {
    width: min(100%, 560px, calc(100vh - 230px)); min-width: 260px; aspect-ratio: 1;
    position: relative; background: var(--paper); border-radius: 14px; box-shadow: var(--shadow);
    border: 2px solid var(--grid); overflow: hidden; max-width: 100%;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .board-wrap > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #anim { pointer-events: none; }
  .sample canvas { width: 100%; height: 100%; }
  .toast {
    position: absolute; top: 12px; left: 50%; transform: translate(-50%, -8px); max-width: 86%;
    background: var(--ink); color: var(--bg); font-size: 14px; padding: 7px 14px; border-radius: 999px;
    opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; text-align: center;
  }
  .toast.show { opacity: .92; transform: translate(-50%, 0); }
  .toast.bad { background: var(--accent); color: #fff; }
  footer { text-align: center; font-size: 11px; color: var(--muted); padding-block: 0 20px; }
  footer a { color: inherit; }
  #ink { touch-action: none; cursor: crosshair; }
  .sample {
    position: absolute; top: 10px; left: 10px; width: 22%; aspect-ratio: 1;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    display: none; pointer-events: none; overflow: hidden;
  }
  .stage[data-mode="copy"] .sample { display: grid; }

  .nav { display: flex; align-items: center; gap: 10px; width: min(100%, 560px); }
  .nav .now { flex: 1; text-align: center; font-size: 14px; color: var(--muted); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: min(100%, 560px); }
  .btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
    transition: transform .08s, background .15s;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
  .btn.round { width: 42px; height: 42px; padding: 0; justify-content: center; border-radius: 50%; font-size: 18px; }

  aside { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h2 { font-size: 13px; color: var(--muted); margin: 0 0 10px; font-weight: 500; letter-spacing: .05em; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-top: 12px; }
  .row label { width: 84px; flex-shrink: 0; color: var(--muted); white-space: nowrap; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 12px; cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

  .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; max-height: 300px; overflow-y: auto; }
  .chip {
    aspect-ratio: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; cursor: pointer;
    font-family: "Klee One", serif; font-size: 18px; position: relative; padding: 0;
  }
  .chip[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .chip::after {
    content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--dot, transparent);
  }
  .custom { display: flex; gap: 6px; margin-bottom: 10px; }
  [hidden] { display: none !important; }
  .custom input {
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px;
  }
  .legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }


  .hint { font-size: 12px; color: var(--muted); text-align: center; }
  kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--surface); }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    header { flex-wrap: wrap; padding-block: 12px; }
    main { padding-block: 0 24px; }
    .tabs { margin-left: 0; width: 100%; }
    .board-wrap { width: min(100%, 560px); }
    .chars { grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); max-height: 180px; }
    .hint.keys { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">もじ<span>れん</span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<main>
  <section class="stage" id="stage" data-mode="trace">
    <div class="board-wrap" id="board">
      <canvas id="bg"></canvas>
      <canvas id="anim"></canvas>
      <canvas id="ink"></canvas>
      <div class="sample" id="sample"><canvas id="sampleCv"></canvas></div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="nav">
      <button class="btn round" id="prev" aria-label="前の文字">‹</button>
      <div class="now" id="now"></div>
      <button class="btn round" id="next" aria-label="次の文字">›</button>
    </div>
    <div class="tools">
      <button class="btn" id="undo">↶ 戻す</button>
      <button class="btn" id="clear">✕ 消す</button>
      <button class="btn" id="shuffle">⤮ ランダム</button>
      <button class="btn primary" id="play">▶ 書き順を見る</button>
    </div>
    <p class="hint keys"><kbd>←</kbd><kbd>→</kbd> 文字移動 ・ <kbd>⌘Z</kbd> 戻す ・ <kbd>Space</kbd> 書き順 ・ <kbd>Esc</kbd> 消す</p>
  </section>

  <aside>
    <div class="card">
      <h2>れんしゅうモード</h2>
      <div class="seg" id="modes">
        <button data-mode="trace" aria-pressed="true">なぞる</button>
        <button data-mode="copy" aria-pressed="false">見て書く</button>
        <button data-mode="recall" aria-pressed="false">何も見ない</button>
      </div>
      <div class="row"><label for="penSize">ペンの太さ</label><input type="range" id="penSize" min="0.5" max="2" step="0.1" value="1"></div>
      <div class="row"><label for="guideAlpha">お手本の濃さ</label><input type="range" id="guideAlpha" min="0.1" max="0.7" step="0.05" value="0.32"></div>
      <label class="toggle"><input type="checkbox" id="orderCheck" checked> 書き順をチェックする</label>
      <label class="toggle"><input type="checkbox" id="gridOn" checked> 十字の補助線</label>
      <label class="toggle"><input type="checkbox" id="autoNext"> 書き順どおり書けたら次の文字へ</label>
    </div>

    <div class="card">
      <h2 id="listTitle">文字</h2>
      <div class="custom" id="customBox" hidden>
        <input id="customInput" placeholder="練習したい文字を入力" maxlength="60">
        <button class="btn" id="customSet">設定</button>
      </div>
      <div class="chars" id="chars"></div>
      <div class="legend">
        <span><i style="background:var(--good)"></i>書き順どおりに書けた文字</span>
      </div>
    </div>
  </aside>
</main>
<footer>書き順データ: <a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>（Ulrich Apel, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>）</footer>

      document.body.appendChild(sampler);
    }
    return paths.map(({ d }) => {
      const el = document.createElementNS(SVGNS, 'path');
      el.setAttribute('d', d);
      sampler.appendChild(el);
      const len = el.getTotalLength();
      const n = Math.max(6, Math.ceil(len / 1.5));
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const q = el.getPointAtLength(len * i / n);
        pts.push({ x: q.x / 109, y: q.y / 109 });
      }
      el.remove();
      return pts;
    });
  }

  function loadStrokes(ch) {
    if (strokeCache.has(ch)) return strokeCache.get(ch);
    if (KVG_DATA[ch]) {
      const p = Promise.resolve(parseKvg(KVG_DATA[ch].map((d, i) => `<path id="kvg:x-s${i + 1}" d="${d}"/>`).join('')));
      strokeCache.set(ch, p);
      return p;
    }
    const cp = ch.codePointAt(0);
    // KanjiVG is only used for kana and kanji; Latin letters and digits fall back to the font.
    const p = cp < 0x3000 ? Promise.resolve(null)
      : fetch(KVG + cp.toString(16).padStart(5, '0') + '.svg')
          .then(r => r.ok ? r.text() : null)
          .then(t => t && parseKvg(t))
          .catch(() => { strokeCache.delete(ch); return null; });
    strokeCache.set(ch, p);
    return p;
  }

  // ---------- glyph & board ----------
  const MODEL_W = 0.058;

  function drawGlyph(ctx, ch, S) {
    ctx.font = `600 ${S * 0.78}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, S / 2, S / 2 + S * 0.02);
  }

  function polyline(ctx, pts, S, upTo = pts.length) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x * S, pts[0].y * S);
    for (let i = 1; i < upTo; i++) ctx.lineTo(pts[i].x * S, pts[i].y * S);
    if (upTo === 1) ctx.lineTo(pts[0].x * S + 0.01, pts[0].y * S);
    ctx.stroke();
  }

  // Draws the reference character: KanjiVG strokes when we have them, otherwise the font glyph.
  function drawModel(ctx, S) {
    if (state.model) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.lineWidth = S * MODEL_W;
      for (const st of state.model) polyline(ctx, st, S);
    } else {
      drawGlyph(ctx, current(), S);
    }
  }

  function strokeNumber(ctx, st, k, S) {
    const p = st[0], q = st[Math.min(3, st.length - 1)];
    const dx = q.x - p.x, dy = q.y - p.y, l = Math.hypot(dx, dy) || 1;
    // put the label just behind the start point, opposite to the writing direction
    const fs = Math.max(S * 0.04, 9), off = fs * 1.1;
    const x = p.x * S - dx / l * off, y = p.y * S - dy / l * off;
    ctx.font = `700 ${fs}px "Zen Maru Gothic", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(k + 1), x, y);
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    size = board.clientWidth;
    for (const c of [bg, anim, ink]) { c.width = size * dpr; c.height = size * dpr; }
    for (const c of [bctx, actx, ictx]) c.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBg(); redrawInk(); drawSample();
  }

  function drawSample() {
    const cv = $('sampleCv'), S = cv.clientWidth;
    if (!S) return;
    cv.width = cv.height = S * dpr;
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.strokeStyle = c.fillStyle = css('--ink');
    drawModel(c, S);
    if (state.model) { c.fillStyle = css('--accent'); state.model.forEach((st, k) => strokeNumber(c, st, k, S)); }
  }

  function drawBg() {
    bctx.clearRect(0, 0, size, size);
    if (state.grid) {
      bctx.save();
      bctx.strokeStyle = css('--grid');
      bctx.lineWidth = 1.2;
      bctx.setLineDash([6, 6]);
      bctx.beginPath();
      bctx.moveTo(size / 2, 0); bctx.lineTo(size / 2, size);
      bctx.moveTo(0, size / 2); bctx.lineTo(size, size / 2);
      bctx.stroke();
      bctx.restore();
    }
    // In the copy / recall modes, reveal the model once every stroke has been written correctly.
    const finished = state.check && state.model && state.strokes.length === state.model.length;
    const reveal = finished && state.mode !== 'trace';
    if (state.mode === 'trace' || reveal) {
      bctx.save();
      bctx.globalAlpha = reveal ? 0.35 : state.guideAlpha;
      bctx.fillStyle = bctx.strokeStyle = reveal ? css('--accent') : css('--guide');
      drawModel(bctx, size);
      bctx.restore();
    }
    // Next-stroke hint: always while tracing, otherwise only after a mistake.
    const k = state.strokes.length;
    if (checking() && (state.mode === 'trace' || state.hint)) {
      const st = state.model[k];
      bctx.save();
      bctx.strokeStyle = bctx.fillStyle = css('--accent');
      bctx.lineCap = 'round'; bctx.lineJoin = 'round';
      bctx.globalAlpha = state.mode === 'trace' ? 0.45 : 0.3;
      bctx.lineWidth = size * MODEL_W;
      polyline(bctx, st, size);
      bctx.globalAlpha = 1;
      bctx.beginPath();
      bctx.arc(st[0].x * size, st[0].y * size, size * 0.018, 0, Math.PI * 2);
      bctx.fill();
      strokeNumber(bctx, st, k, size);
      bctx.restore();
    }
  }

  // ---------- stroke order animation & effects ----------
  let animToken = 0;
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const frame = () => new Promise(r => requestAnimationFrame(r));

  function stopAnim() {
    animToken++;
    anim.style.transition = 'none';
    anim.style.opacity = 1;
    actx.clearRect(0, 0, size, size);
  }

  async function playOrder() {
    const ch = current();
    const model = state.model || await loadStrokes(ch);
    if (ch !== current()) return;
    if (!model) { toast('この文字には書き順データがありません', true); return; }
    stopAnim();
    const token = animToken;
    const pen = css('--pen'), accent = css('--accent');
    const render = (k, t) => {
      actx.clearRect(0, 0, size, size);
      actx.lineCap = 'round'; actx.lineJoin = 'round';
      actx.lineWidth = size * MODEL_W;
      for (let j = 0; j <= k; j++) {
        const st = model[j];
        actx.strokeStyle = j === k ? accent : pen;
        polyline(actx, st, size, j === k ? Math.max(1, Math.round(st.length * t)) : st.length);
        actx.fillStyle = accent;
        strokeNumber(actx, st, j, size);
      }
    };
    for (let k = 0; k < model.length; k++) {
      const st = model[k];
      let len = 0;
      for (let i = 1; i < st.length; i++) len += Math.hypot(st[i].x - st[i - 1].x, st[i].y - st[i - 1].y);
      const dur = 220 + len * 1100;
      const t0 = performance.now();
      for (;;) {
        await frame();
        if (token !== animToken) return;
        const t = Math.min(1, (performance.now() - t0) / dur);
        render(k, t);
        if (t >= 1) break;
      }
      await sleep(180);
      if (token !== animToken) return;
    }
    await sleep(900);
    if (token !== animToken) return;
    anim.style.transition = 'opacity .6s';
    anim.style.opacity = 0;
    await sleep(650);
    if (token === animToken) stopAnim();
  }

  // Briefly shows a rejected stroke in red, then fades it out.
  async function flashWrong(stroke) {
    stopAnim();
    const token = animToken;
    actx.strokeStyle = actx.fillStyle = css('--accent');
    drawStroke(actx, stroke, size);
    await frame(); await frame();
    if (token !== animToken) return;
    anim.style.transition = 'opacity .7s .2s';
    anim.style.opacity = 0;
    await sleep(950);
    if (token === animToken) stopAnim();
  }

  let toastTimer = 0;
  function toast(text, bad = false) {
    const t = $('toast');
    t.textContent = text;
    t.classList.toggle('bad', bad);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- stroke order check ----------
  function checking() {
    return state.check && state.model && state.strokes.length < state.model.length;
  }

  function resample(pts, n = 24) {
    if (pts.length === 1) return Array(n).fill(pts[0]);
    const d = [0];
    for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    const total = d[d.length - 1] || 1e-6, out = [];
    for (let k = 0, j = 1; k < n; k++) {
      const target = total * k / (n - 1);
      while (j < pts.length - 1 && d[j] < target) j++;
      const seg = d[j] - d[j - 1] || 1e-6, t = Math.max(0, Math.min(1, (target - d[j - 1]) / seg));
      out.push({ x: pts[j - 1].x + (pts[j].x - pts[j - 1].x) * t, y: pts[j - 1].y + (pts[j].y - pts[j - 1].y) * t });
    }
    return out;
  }
  const meanDist = (A, B) => A.reduce((s, p, i) => s + Math.hypot(p.x - B[i].x, p.y - B[i].y), 0) / A.length;
  const TOL = 0.085;

  function judge(stroke) {
    const k = state.strokes.length, model = state.model;
    const U = resample(stroke);
    const T = resample(model[k]);
    const fwd = meanDist(U, T), rev = meanDist(U, [...T].reverse());
    if (fwd < TOL) return { ok: true };
    if (rev < TOL) return { ok: false, msg: `${k + 1}画目は書く向きが反対です` };
    for (let j = k + 1; j < model.length; j++) {
      const Tj = resample(model[j]);
      if (Math.min(meanDist(U, Tj), meanDist(U, [...Tj].reverse())) < TOL)
        return { ok: false, msg: `それは${j + 1}画目。先に${k + 1}画目を書こう` };
    }
    return { ok: false, msg: `${k + 1}画目の位置や形がちがいます` };
  }

  // ---------- pen ----------
  // Points are stored normalised (0..1) so the drawing survives resizes.
  function baseWidth() { return 0.034 * state.pen; }

  function drawSegment(ctx, pts, i, S) {
    const p0 = pts[i - 2] || pts[i - 1], p1 = pts[i - 1], p2 = pts[i];
    const m0 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
    const m1 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    ctx.lineWidth = ((p1.w + p2.w) / 2) * S;
    ctx.beginPath();
    ctx.moveTo(m0.x * S, m0.y * S);
    ctx.quadraticCurveTo(p1.x * S, p1.y * S, m1.x * S, m1.y * S);
    ctx.stroke();
  }

  function drawStroke(ctx, stroke, S, widthOverride) {
    const pts = widthOverride ? stroke.map(p => ({ ...p, w: widthOverride })) : stroke;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (pts.length === 1) {
      ctx.beginPath();
      ctx.arc(pts[0].x * S, pts[0].y * S, pts[0].w * S / 2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    for (let i = 1; i < pts.length; i++) drawSegment(ctx, pts, i, S);
    const a = pts[pts.length - 2], b = pts[pts.length - 1];
    ctx.lineWidth = b.w * S;
    ctx.beginPath();
    ctx.moveTo((a.x + b.x) / 2 * S, (a.y + b.y) / 2 * S);
    ctx.lineTo(b.x * S, b.y * S);
    ctx.stroke();
  }

  function redrawInk() {
    ictx.clearRect(0, 0, size, size);
    ictx.strokeStyle = ictx.fillStyle = css('--pen');
    for (const s of state.strokes) drawStroke(ictx, s, size);
  }

  let live = null, lastT = 0, lastW = 0;
  function pointFrom(e) {
    const r = ink.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  }
  function widthFor(e, p, prev) {
    const base = baseWidth();
    if (e.pointerType === 'pen' && e.pressure > 0) return base * (0.35 + e.pressure * 1.1);
    if (!prev) return base * 1.05;
    const dt = Math.max(1, e.timeStamp - lastT);
    const v = Math.hypot(p.x - prev.x, p.y - prev.y) * size / dt; // px per ms
    const target = base * Math.max(0.55, Math.min(1.15, 1.2 - v * 0.22));
    return lastW + (target - lastW) * 0.35;
  }

  ink.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    stopAnim();
    ink.setPointerCapture(e.pointerId);
    const p = pointFrom(e);
    lastT = e.timeStamp; lastW = baseWidth();
    p.w = widthFor(e, p, null); lastW = p.w;
    live = [p];
    ictx.strokeStyle = ictx.fillStyle = css('--pen');
    drawStroke(ictx, live, size);
  });
  ink.addEventListener('pointermove', (e) => {
    if (!live) return;
    const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    const events = coalesced.length ? coalesced : [e];
    for (const ev of events) {
      const p = pointFrom(ev);
      const prev = live[live.length - 1];
      if (Math.hypot(p.x - prev.x, p.y - prev.y) * size < 1.5) continue;
      p.w = widthFor(ev, p, prev); lastW = p.w; lastT = ev.timeStamp;
      live.push(p);
      ictx.lineCap = 'round';
      drawSegment(ictx, live, live.length - 1, size);
    }
  });
  const endStroke = () => {
    if (!live) return;
    // taper the tail like a brush lifting off
    if (live.length > 3) {
      const n = Math.min(4, live.length - 1);
      for (let k = 0; k < n; k++) live[live.length - 1 - k].w *= 0.6 + 0.1 * k;
    }
    const stroke = live;
    live = null;
    if (checking()) {
      const res = judge(stroke);
      if (res.ok) {
        state.strokes.push(stroke);
        state.hint = false;
        if (state.strokes.length === state.model.length) complete();
      } else {
        state.hint = true;
        toast(res.msg, true);
        flashWrong(stroke);
      }
      drawBg();
    } else {
      state.strokes.push(stroke);
    }
    redrawInk();
    updateNow();
  };
  ink.addEventListener('pointerup', endStroke);
  ink.addEventListener('pointercancel', endStroke);

  function complete() {
    const ch = current();
    toast('できた！ 書き順ばっちり');
    if (!state.done[ch]) { state.done[ch] = true; store.set('done', state.done); renderChars(); }
    if (state.autoNext) setTimeout(() => { if (ch === current() && state.strokes.length === state.model?.length) go(1); }, 1300);
  }

  // ---------- UI ----------
  function renderTabs() {
    $('tabs').innerHTML = '';
    for (const [key, s] of Object.entries(SETS)) {
      const b = document.createElement('button');
      b.className = 'tab'; b.role = 'tab'; b.textContent = s.label;
      b.setAttribute('aria-selected', key === state.set);
      b.onclick = () => selectSet(key);
      $('tabs').appendChild(b);
    }
  }
  function renderChars() {
    const box = $('chars');
    box.innerHTML = '';
    SETS[state.set].chars.forEach((ch, i) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = ch;
      b.setAttribute('aria-current', i === state.idx);
      if (state.done[ch]) { b.style.setProperty('--dot', css('--good')); b.title = `${ch}: 書き順どおりに書けました`; }
      b.onclick = () => { state.idx = i; load(); };
      box.appendChild(b);
    });
    $('listTitle').textContent = `${SETS[state.set].label}（${SETS[state.set].chars.length}字）`;
    $('customBox').hidden = state.set !== 'custom';
  }
  function updateNow() {
    const done = state.done[current()];
    const strokes = state.model ? `${state.strokes.length} / ${state.model.length}画` : `${state.strokes.length}画`;
    $('now').textContent = `${state.idx + 1} / ${SETS[state.set].chars.length}　・　${strokes}` + (done ? '　・　✓ クリア' : '');
  }
  function load() {
    state.strokes = []; live = null; state.hint = false; state.model = null;
    store.set('idx:' + state.set, state.idx);
    stopAnim();
    drawBg(); redrawInk(); updateNow(); drawSample();
    const ch = current();
    loadStrokes(ch).then(model => {
      if (ch !== current()) return;
      state.model = model;
      drawBg(); drawSample(); updateNow();
    });
    const chars = SETS[state.set].chars;
    loadStrokes(chars[(state.idx + 1) % chars.length]);
    document.querySelectorAll('.chip').forEach((c, i) => c.setAttribute('aria-current', i === state.idx));
    const cur = document.querySelector('.chip[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  function go(d) {
    const n = SETS[state.set].chars.length;
    state.idx = (state.idx + d + n) % n;
    load();
  }
  function selectSet(key) {
    state.set = key; store.set('set', key);
    state.idx = Math.min(store.get('idx:' + key, 0), SETS[key].chars.length - 1);
    renderTabs(); renderChars(); load();
  }
  function setMode(m) {
    state.mode = m; store.set('mode', m);
    $('stage').dataset.mode = m;
    document.querySelectorAll('#modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
    drawBg(); drawSample();
  }

  $('prev').onclick = () => go(-1);
  $('next').onclick = () => go(1);
  $('undo').onclick = () => { state.strokes.pop(); state.hint = false; drawBg(); redrawInk(); updateNow(); };
  $('clear').onclick = () => { state.strokes = []; state.hint = false; drawBg(); redrawInk(); updateNow(); };
  $('play').onclick = playOrder;
  $('shuffle').onclick = () => { const n = SETS[state.set].chars.length; let j; do { j = Math.floor(Math.random() * n); } while (n > 1 && j === state.idx); state.idx = j; load(); };
  document.querySelectorAll('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.mode));

  $('penSize').value = state.pen;
  $('penSize').oninput = (e) => { state.pen = +e.target.value; store.set('pen', state.pen); };
  $('guideAlpha').value = state.guideAlpha;
  $('guideAlpha').oninput = (e) => { state.guideAlpha = +e.target.value; store.set('guideAlpha', state.guideAlpha); drawBg(); };
  $('orderCheck').checked = state.check;
  $('orderCheck').onchange = (e) => { state.check = e.target.checked; store.set('check', state.check); state.hint = false; drawBg(); };
  $('gridOn').checked = state.grid;
  $('gridOn').onchange = (e) => { state.grid = e.target.checked; store.set('grid', state.grid); drawBg(); };
  $('autoNext').checked = state.autoNext;
  $('autoNext').onchange = (e) => { state.autoNext = e.target.checked; store.set('autoNext', state.autoNext); };

  const applyCustom = () => {
    const chars = [...new Set([...$('customInput').value].filter(c => c.trim()))];
    if (!chars.length) return;
    SETS.custom.chars = chars; store.set('custom', chars);
    state.idx = 0; renderChars(); load();
  };
  $('customSet').onclick = applyCustom;
  $('customInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); applyCustom(); } });
  $('customInput').value = SETS.custom.chars.join('');

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); $('undo').click(); }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === ' ') { e.preventDefault(); if (e.target.blur) e.target.blur(); playOrder(); }
    else if (e.key === 'Escape' || e.key === 'Delete' || e.key === 'Backspace') $('clear').click();
  });

  new ResizeObserver(resize).observe(board);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { drawBg(); redrawInk(); drawSample(); renderChars(); });

  setMode(state.mode);
  renderTabs(); renderChars(); load();
  document.fonts.ready.then(() => { drawBg(); renderChars(); });
  document.fonts.load(`600 100px "Klee One"`, 'あ').then(drawBg).catch(() => {});

  // Offline support when served over http(s), e.g. GitHub Pages.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
